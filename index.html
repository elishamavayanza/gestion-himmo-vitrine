<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f7f5" />
    <meta name="description" content="H‑Immo Habitat : découvrez les biens immobiliers publiés par les agences partenaires." />
    <title>H‑Immo Habitat</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('h-immo-vitrine-theme')
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/assets/react/app/main.tsx"></script>
  </body>
</html>
